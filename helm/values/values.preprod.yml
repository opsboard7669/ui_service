# Preprod Environment Values - ui-service

replicaCount: 1

image:
  repository: "944101542155.dkr.ecr.ap-south-1.amazonaws.com/task-manager/ui-service"
  tag: ""
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  host: "preprod.taskmanager.com"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "256Mi"